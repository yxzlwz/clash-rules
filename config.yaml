# -----------------------------------------------------------------------------
# Rules
# Specific services first, China direct near the end, then final whitelist proxy.
# -----------------------------------------------------------------------------
rules:
  # Optional user-specific rules
  - DOMAIN-SUFFIX,polymarket.com,🇭🇰 Hong Kong

  - RULE-SET,Lan_No_Resolve,Lan
  - RULE-SET,Apple_Classical_No_Resolve,Apple
  - RULE-SET,BiliBili_No_Resolve,BiliBili
  - RULE-SET,Netflix_No_Resolve,Netflix
  - RULE-SET,Disney_No_Resolve,Disney
  - RULE-SET,YouTube_No_Resolve,YouTube
  - RULE-SET,TikTok_No_Resolve,TikTok
  - RULE-SET,GlobalMedia_Classical_No_Resolve,GlobalMedia
  - RULE-SET,OpenAI_No_Resolve,OpenAI
  - RULE-SET,Google_No_Resolve,Google
  - RULE-SET,Microsoft_No_Resolve,Microsoft
  - RULE-SET,PayPal_No_Resolve,PayPal
  - RULE-SET,Telegram_No_Resolve,Telegram
  - RULE-SET,Steam_No_Resolve,Steam

  # Lightweight China routing: 3,070-domain cache + GeoIP fallback
  - RULE-SET,China_Domain,🇨🇳 China
  - GEOIP,CN,🇨🇳 China

  # Optional: force unmatched HTTP/3/QUIC traffic back to TCP.
  # Enable only if you specifically want this behavior.
  # - AND,((NETWORK,udp),(DST-PORT,443)),REJECT

  - MATCH,Final

# -----------------------------------------------------------------------------
# Sniffer
# -----------------------------------------------------------------------------
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: false
  override-destination: true
  sniff:
    HTTP:
      ports: [1-65535]
      override-destination: true
    TLS:
      ports: [1-65535]
      override-destination: true
    QUIC:
      ports: [1-65535]
      override-destination: true
  skip-domain:
    - Mijia Cloud
    - dlg.io.mi.com
    - +.push.apple.com
