# Universal Stash / Mihomo (Clash Meta) multi-subscription configuration
# Rule scale (2026-08-29): about 10,500 expanded rules.
# Universal multi-airport template: fill any Clash/Stash subscription URLs in proxy-providers below.
# All proxy groups aggregate every enabled provider; no logic depends on a specific airport/provider name.

port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
external-controller: 127.0.0.1:9090

# -----------------------------------------------------------------------------
# DNS
# DNS settings are kept close to your original configuration for compatibility.
# -----------------------------------------------------------------------------
dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/15
  ipv6: false
  default-nameserver:
    - 119.28.28.28
    - 119.29.29.29
    - 223.5.5.5
    - 223.6.6.6
  nameserver:
    - 119.29.29.29
    - 223.5.5.5
    - tls://dot.pub:853
    - tls://dns.alidns.com:853
    - https://doh.pub:443/dns-query
    - https://dns.alidns.com:443/dns-query
  fake-ip-filter:
    - '*.lan'
    - '*.localdomain'
    - '*.localhost'
    - '*.local'
    - '*.home.arpa'
    - 'localhost.ptlogin2.qq.com'
    - '+.push.apple.com'

# -----------------------------------------------------------------------------
# Proxy providers
# Replace the placeholder URLs. Duplicate a block to add Sub5/Sub6/... later.
# -----------------------------------------------------------------------------
proxy-providers:
  # IMPORTANT: Fill every active provider URL. Delete an unused active provider.
  # The subscription response should be Clash/Stash YAML containing a `proxies:` field.
  $$NAME$$:
    type: http
    url: '$$URL$$'
    path: ./providers/$$NAME$$.yaml
    interval: 43200

# -----------------------------------------------------------------------------
# Proxy groups
# include-all makes every subscription automatically participate (supported by Stash and Mihomo).
# -----------------------------------------------------------------------------
proxy-groups:
  - name: 🚀 Proxy
    type: select
    include-all: true
    proxies:
      - Auto
      - 🇭🇰 Hong Kong
      - 🇸🇬 Singapore
      - 🇯🇵 Japan
      - 🇺🇸 United States
      - 🇹🇼 Taiwan
      - 🏠 Home Broadband
      - DIRECT

  - name: Auto
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300

  - name: 🇭🇰 Hong Kong
    type: url-test
    include-all: true
    filter: '(?i)(🇭🇰|香港|Hong ?Kong|HKG|\bHK\b)'
    url: https://www.gstatic.com/generate_204
    interval: 300

  - name: 🇸🇬 Singapore
    type: url-test
    include-all: true
    filter: '(?i)(🇸🇬|新加坡|狮城|Singapore|SGP|\bSG\b)'
    url: https://www.gstatic.com/generate_204
    interval: 300

  - name: 🇯🇵 Japan
    type: url-test
    include-all: true
    filter: '(?i)(🇯🇵|日本|东京|大阪|Japan|JPN|\bJP\b)'
    url: https://www.gstatic.com/generate_204
    interval: 300

  - name: 🇺🇸 United States
    type: url-test
    include-all: true
    filter: '(?i)(🇺🇸|美国|洛杉矶|圣何塞|西雅图|纽约|United States|USA|\bUS\b)'
    url: https://www.gstatic.com/generate_204
    interval: 300

  - name: 🇹🇼 Taiwan
    type: url-test
    include-all: true
    filter: '(?i)(🇹🇼|台湾|台北|Taiwan|TWN|\bTW\b)'
    url: https://www.gstatic.com/generate_204
    interval: 300

  - name: 🏠 Home Broadband
    type: url-test
    include-all: true
    filter: '(?i)(家宽|住宅|Residential|Home Broadband|ISP)'
    url: https://www.gstatic.com/generate_204
    interval: 300

  - name: Apple
    type: select
    proxies: [DIRECT, 🚀 Proxy, Auto, 🇭🇰 Hong Kong, 🇸🇬 Singapore, 🇯🇵 Japan, 🇺🇸 United States, 🇹🇼 Taiwan]

  - name: BiliBili
    type: select
    proxies: [DIRECT, 🚀 Proxy, 🇭🇰 Hong Kong, 🇹🇼 Taiwan]

  - name: Netflix
    type: select
    proxies: [🚀 Proxy, Auto, 🇭🇰 Hong Kong, 🇸🇬 Singapore, 🇯🇵 Japan, 🇺🇸 United States, 🇹🇼 Taiwan, 🏠 Home Broadband]

  - name: Disney
    type: select
    proxies: [🚀 Proxy, Auto, 🇭🇰 Hong Kong, 🇸🇬 Singapore, 🇯🇵 Japan, 🇺🇸 United States, 🇹🇼 Taiwan, 🏠 Home Broadband]

  - name: YouTube
    type: select
    proxies: [🚀 Proxy, Auto, 🇭🇰 Hong Kong, 🇸🇬 Singapore, 🇯🇵 Japan, 🇺🇸 United States, 🇹🇼 Taiwan]

  - name: TikTok
    type: select
    proxies: [🚀 Proxy, Auto, 🇭🇰 Hong Kong, 🇸🇬 Singapore, 🇯🇵 Japan, 🇺🇸 United States, 🇹🇼 Taiwan]

  - name: GlobalMedia
    type: select
    proxies: [🚀 Proxy, Auto, 🇭🇰 Hong Kong, 🇸🇬 Singapore, 🇯🇵 Japan, 🇺🇸 United States, 🇹🇼 Taiwan]

  - name: OpenAI
    type: select
    proxies: [🚀 Proxy, Auto, 🇸🇬 Singapore, 🇯🇵 Japan, 🇺🇸 United States, 🏠 Home Broadband]

  - name: Google
    type: select
    proxies: [🚀 Proxy, Auto, 🇭🇰 Hong Kong, 🇸🇬 Singapore, 🇯🇵 Japan, 🇺🇸 United States, 🇹🇼 Taiwan]

  - name: Microsoft
    type: select
    proxies: [DIRECT, 🚀 Proxy, Auto, 🇭🇰 Hong Kong, 🇸🇬 Singapore, 🇯🇵 Japan, 🇺🇸 United States, 🇹🇼 Taiwan]

  - name: Steam
    type: select
    proxies: [DIRECT, 🚀 Proxy, Auto, 🇭🇰 Hong Kong, 🇸🇬 Singapore, 🇯🇵 Japan, 🇺🇸 United States, 🇹🇼 Taiwan]

  - name: PayPal
    type: select
    proxies: [DIRECT, 🚀 Proxy, Auto, 🇭🇰 Hong Kong, 🇸🇬 Singapore, 🇯🇵 Japan, 🇺🇸 United States, 🏠 Home Broadband]

  - name: Telegram
    type: select
    proxies: [🚀 Proxy, 🇭🇰 Hong Kong, 🇸🇬 Singapore, 🇯🇵 Japan, 🇺🇸 United States, 🇹🇼 Taiwan]

  - name: Lan
    type: select
    proxies: [DIRECT, 🚀 Proxy]

  - name: 🇨🇳 China
    type: select
    proxies: [DIRECT, 🚀 Proxy]

  - name: Final
    type: select
    proxies: [🚀 Proxy, Auto, DIRECT, 🇭🇰 Hong Kong, 🇸🇬 Singapore, 🇯🇵 Japan, 🇺🇸 United States, 🇹🇼 Taiwan, 🏠 Home Broadband]

