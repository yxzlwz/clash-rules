# Minimal Mihomo / Clash Meta configuration: proxy OpenAI and Claude only.
port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
external-controller: 127.0.0.1:9090

dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/15
  ipv6: false
  default-nameserver:
    - 119.28.28.28
    - 223.5.5.5
  nameserver:
    - 119.29.29.29
    - 223.5.5.5
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

proxy-groups:
  - name: 🚀 Proxy
    type: select
    include-all: true
    proxies: [Auto, DIRECT]

  - name: Auto
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300

  - name: OpenAI
    type: select
    proxies: [🚀 Proxy, Auto, DIRECT]

  - name: Anthropic
    type: select
    proxies: [🚀 Proxy, Auto, DIRECT]

rule-providers:
  OpenAI_No_Resolve:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    url: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/OpenAI/OpenAI_No_Resolve.yaml

  Claude_No_Resolve:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    url: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Claude/Claude_No_Resolve.yaml

rules:
  - RULE-SET,OpenAI_No_Resolve,OpenAI
  - RULE-SET,Claude_No_Resolve,Anthropic
  - MATCH,DIRECT

sniffer:
  enable: true
  force-dns-mapping: true
  override-destination: true
  sniff:
    HTTP:
      ports: [1-65535]
      override-destination: true
    TLS:
      ports: [1-65535]
      override-destination: true
    QUIC:
      ports: [1-65535]
      override-destination: true
